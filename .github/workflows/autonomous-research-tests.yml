name: Autonomous Research Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Test Brain
        run: npm run test:brain

      - name: Test Strategy Lab
        run: npm run test:lab

      - name: Test Paper Promotion Gate
        run: npm run test:auto-paper

      - name: Test Autonomous Orchestrator
        run: npm run test:autonomous
